# China-friendly package mirrors without pinning a third-party GitHub proxy.
# GITHUB_MIRROR is optional and must use HTTPS when configured.
hooks:
  before_code:
    - exec:
        cmd:
          - |
            set -e
            case "$GITHUB_MIRROR" in
              ""|https://*) ;;
              *)
                echo "GITHUB_MIRROR must be empty or an HTTPS replacement prefix"
                exit 1
                ;;
            esac
            if [ -n "$GITHUB_MIRROR" ]; then
              su discourse -c "git config --global url.\"${GITHUB_MIRROR}\".insteadOf \"https://github.com/\""
            fi

  before_web:
    - exec:
        cmd:
          - su discourse -c 'gem sources --add https://mirrors.tuna.tsinghua.edu.cn/rubygems/ --remove https://rubygems.org/'

  before_yarn:
    - exec:
        cmd:
          - su discourse -c 'pnpm config set registry https://registry.npmmirror.com --global'

  before_bundle_exec:
    - exec:
        cd: $home
        cmd:
          - |
            set -e
            mirror="https://mirrors.tuna.tsinghua.edu.cn/rubygems"
            if ! curl -fsSI --connect-timeout 10 --max-time 30 "$mirror/" >/dev/null; then
              echo "RubyGems mirror is unreachable: $mirror"
              exit 1
            fi
            # The install command runs in $home. Set both scopes explicitly so
            # its project-local .bundle/config always contains the mirror.
            su discourse -c "bundle config set --global mirror.https://rubygems.org $mirror"
            su discourse -c "bundle config set --local mirror.https://rubygems.org $mirror"
            su discourse -c "bundle config set --global mirror.https://rubygems.org.fallback_timeout 30"
            su discourse -c "bundle config set --local mirror.https://rubygems.org.fallback_timeout 30"
            configured="$(su discourse -c 'bundle config get --local mirror.https://rubygems.org')"
            printf '%s\n' "$configured"
            if ! printf '%s\n' "$configured" | grep -Fq "$mirror"; then
              echo "Bundler project-local mirror verification failed"
              exit 1
            fi
